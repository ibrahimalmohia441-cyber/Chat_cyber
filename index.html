<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الهيدر العلوي المشترك -->
    <header id="chat-header">
        <!-- الجانب الأيسر: زر الرجوع واسم المستخدم داخل الدردشة / أو العنوان الرئيسي -->
        <div class="chat-header-left">
            <button id="back-btn" onclick="goBack()" style="display: none;">⬅️</button>
            <h2 id="header-title">عقد الشبكة المسجلة</h2>
            <span id="header-username" style="display: none;"></span>
        </div>

        <!-- الجانب الأيمن: زر الإعدادات أو قائمة الثلاث نقاط -->
        <div class="chat-header-right">
            <button id="settings-btn" onclick="openSettings()" style="display: none;">⚙️</button>
            
            <!-- قائمة الثلاث نقاط الخاصة بالدردشة -->
            <div id="chat-menu-container" style="position: relative; display: none;">
                <button id="menu-dots-btn" onclick="toggleChatMenu()">⋮</button>
                <div id="chat-dropdown-menu" class="dropdown-content">
                    <a href="#" onclick="clearCurrentChat(); return false;">🗑️ حذف محتوى الدردشة</a>
                </div>
            </div>
        </div>
    </header>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen" class="screen">
        <div class="login-card">
            <h2>تسجيل الدخول للشبكة</h2>
            <p>أدخل اسمك أو المعرف للبدء بالدردشة المشفرة</p>
            <input type="text" id="username-input" placeholder="اسم المستخدم..." autocomplete="off">
            <button onclick="joinApp()">دخول الشبكة</button>
        </div>
    </div>

    <!-- شاشة قائمة المستخدمين -->
    <div id="users-screen" class="screen" style="display: none;">
        <div class="users-container">
            <h3>المستخدمون المتصلون</h3>
            <ul id="users-list">
                <!-- يتم تعبئتها تلقائياً عبر الجافاسكريبت -->
            </ul>
        </div>
    </div>

    <!-- شاشة المحادثة الفردية -->
    <div id="chat-screen" class="screen" style="display: none;">
        <div id="messages" class="messages-container">
            <!-- رسائل الشات -->
        </div>
        
        <div id="typing-indicator" class="typing-indicator"></div>

        <form id="chat-form" class="chat-input-area">
            <label for="file-input" class="file-btn" title="إرسال ملف">📁</label>
            <input type="file" id="file-input" style="display: none;" onchange="sendFile(event)">
            
            <input type="text" id="msg-input" placeholder="اكتب رسالتك هنا..." autocomplete="off">
            <button type="submit" id="send-btn">➤</button>
        </form>
    </div>

    <!-- مكتبة Socket.io -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
