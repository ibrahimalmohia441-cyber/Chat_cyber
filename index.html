<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Chat | منصة طلاب الأمن السيبراني</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <div class="header">
            <button class="back-btn" id="back-btn" onclick="goBack()">&#8594;</button>
            <h2 id="header-title">CYBER // TERMINAL_LOGIN</h2>
            <!-- استبدل هذا السطر -->
            <button id="settings-btn" onclick="openSettings()" style="display: none; position: absolute; left: 15px; background: none; border: 1px solid #00ff66; color: #00ff66; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">⚙️ الإعدادات</button>
        </div>

        <div id="login-screen" class="screen" style="display: flex;">
            <div class="login-card">
                <div class="cyber-badge">SECURE_NODE</div>
                <h3>تسجيل الدخول للنظام</h3>
                <input type="text" id="username-input" placeholder="أدخل اسم المستخدم أو الرمز..." autocomplete="off">
                <button onclick="joinApp()">اتصال آمن [CONNECT]</button>
            </div>
        </div>

        <div id="users-screen" class="screen">
            <ul id="users-list" class="users-list"></ul>
        </div>

      <div id="chat-screen" style="display: none; flex-direction: column; height: 100%;">
    <!-- عناصر المحادثة الأخرى -->
    <div id="messages" style="flex: 1; overflow-y: auto; padding: 10px;"></div>
    <div id="typing-indicator" style="padding: 0 10px; font-size: 0.8rem; color: #00ff66;"></div>
    
    <form id="chat-form" style="display: flex; padding: 10px; gap: 5px; background: #111;">
        <input type="file" id="file-input" style="display: none;" onchange="sendFile(event)">
        <button type="button" onclick="document.getElementById('file-input').click()" style="background: none; border: 1px solid #00ff66; color: #00ff66; padding: 8px; border-radius: 4px; cursor: pointer;">📁</button>
        <input type="text" id="msg-input" placeholder="اكتب رسالتك..." style="flex: 1; background: #000; border: 1px solid #00ff66; color: #00ff66; padding: 8px; border-radius: 4px;">
        <button type="submit" style="background: #00ff66; color: #000; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold;">إرسال</button>
        <!-- زر المسح الجديد داخل المحادثة -->
        <button type="button" id="clear-chat-btn" onclick="clearCurrentChat()" style="background: none; border: 1px solid #ff4444; color: #ff4444; padding: 8px 12px; border-radius: 4px; cursor: pointer;" title="مسح المحادثة">🗑️</button>
    </form>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
